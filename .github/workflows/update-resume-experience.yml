name: Update resume experience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-resume-experience.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite top experience entries
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/resume/page.tsx')
          text = path.read_text()

          start = text.index('const experience = [')
          security = text.index('  {\n    title: "Security Officer"', start)

          replacement = '''const experience = [
  {
    title: "Owner",
    company: "EZDigital",
    location: "Angeles City, Philippines · Remote",
    period: "Jun 2025 - Present",
    summary:
      "Formalized years of freelance digital work into EZDigital, providing web design, online marketing, and media production services for businesses and organizations.",
    details: [
      "Design, build, maintain, and optimize business websites across modern custom stacks, WordPress, Elementor, and Shopify.",
      "Provide online marketing support including SEO, advertising strategy, conversion-focused website improvements, and client acquisition assets.",
      "Create digital media including flyers, promotional graphics, website assets, and edited video content.",
      "Manage ongoing client work for businesses including Prime Oral Dental Clinic and King Fandom while continuing project-based freelance engagements under the EZDigital brand.",
    ],
  },
  {
    title: "Freelance Digital Designer / Web Support",
    company: "Freelance",
    location: "Remote",
    period: "Jun 2023 - Jun 2025",
    summary:
      "Provided project-based digital services after completing my Fairly internship, focusing on practical design, media, and website support for small businesses and individual clients.",
    details: [
      "Created digital flyers, promotional graphics, and other client-facing visual assets.",
      "Edited short-form and promotional video content for web and social media use.",
      "Handled small website design changes, content updates, layout improvements, and general web support.",
      "Expanded recurring freelance work into the business that became EZDigital in June 2025.",
    ],
  },
  {
    title: "General Manager",
    company: "King Fandom",
    location: "Canoga Park, California",
    period: "Oct 2017 - Dec 2023",
    summary:
      "Managed a retail and ecommerce operation spanning inventory, warehousing, staffing, sales, marketing, and process improvement.",
    details: [
      "Managed inventory databases containing more than 500,000 line items and ecommerce logistics.",
      "Oversaw a warehouse valued above $1 million and led hiring, training, and operations for 25+ employees.",
      "Directed social media, website, multimedia, B2B/B2C sales, and marketing strategy.",
      "Continuously improved business processes while supporting customer service, fulfillment, and day-to-day operations.",
    ],
  },
  {
    title: "Full-stack Developer Intern",
    company: "Fairly",
    location: "Los Angeles, California · Remote",
    period: "Feb 2023 - Jun 2023",
    summary:
      "Completed a full-stack development internship with Fairly, a short-term rental marketplace positioned as an alternative to platforms such as Airbnb.",
    details: [
      "Built React components, forms, and Bootstrap/CSS styling to match existing product themes.",
      "Created SQL tables and stored procedures using foreign keys, bridge tables, and existing datasets.",
      "Implemented .NET API endpoints and C# methods within existing in-house middle tiers.",
      "Used branch-based GitHub workflows and collaborated with the development team on production requirements and dependencies.",
    ],
  },
'''

          text = text[:start] + replacement + text[security:]
          path.write_text(text)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/resume/page.tsx
          git commit -m "Reorder and clarify professional experience"
          git push
